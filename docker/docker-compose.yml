# =============================================================================
# CASAtlas — Docker Compose
#
# Zero-config quick start (any Docker host):
# git clone https://github.com/vihaanvp/CASAtlas.git
# cd CASAtlas
# cp .env.example .env
# # Edit .env with your secrets (AUTH_SECRET, OAuth credentials, etc.)
# docker compose up -d
# Open http://localhost:3000
#
# Uses the pre-built image from GitHub Container Registry (multi-arch).
# To build from source instead: `docker compose up -d --build`
# =============================================================================

services:
  app:
    image: ghcr.io/vihaanvp/casatlas:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      # Database URL is loaded from .env (DATABASE_URL)
      # For external DB, set DATABASE_URL in .env
      # For local compose DB, default is provided below
      DATABASE_URL: ${DATABASE_URL:-postgresql://casatlas:casatlas@db:5432/casatlas}
      # Auth
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      # OAuth (leave empty to disable)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Registration (runtime toggle in admin panel overrides)
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Dev-only email login (DO NOT enable in production)
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
      # Upload
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casatlas
      POSTGRES_USER: casatlas
      POSTGRES_PASSWORD: casatlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casatlas"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data: