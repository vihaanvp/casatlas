# =============================================================================
# CASAtlas — Docker Build & Publish
# Builds multi-arch image and pushes to GitHub Container Registry (ghcr.io)
#
# Each architecture is built natively (QEMU-emulated arm64 intermittently
# crashes with SIGILL during Next.js's Turbopack page build), pushed under a
# per-platform tag, then merged into the final tags by `imagetools create`.
# =============================================================================

name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=CASAtlas — IB CAS portfolio tracker
            org.opencontainers.image.licenses=MIT

      # Push under per-platform tags only — pushing the shared tags directly
      # from two jobs races (last finisher overwrites the manifest list).
      # Suffix each tag line individually (appending to the whole multi-line
      # output would only suffix the last line).
      - name: Compute per-platform tags
        id: platform
        run: |
          TAGS=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            case "$t" in \#*) continue ;; esac
            TAGS="$TAGS
$t-${{ matrix.suffix }}"
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.platform.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  merge:
    name: Merge multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Merge per-platform images into final tags
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          while IFS= read -r tag; do
            # skip empty lines and the metadata-action '#' comment header
            [ -z "$tag" ] && continue
            case "$tag" in \#*) continue ;; esac
            docker buildx imagetools create \
              -t "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
            echo "merged $tag"
          done <<< "$TAGS"
